services:
  frontend:
    # Pre-built image from GitHub Container Registry.
    # Built by GitHub Actions (7GB RAM) — never built on the VPS.
    # To update: push to main → GH Actions builds → pushes here → Coolify pulls.
    image: ghcr.io/official-collabify/collabify-frontend:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    # Healthcheck is defined in the Dockerfile (uses curl, which is installed).
    # Defining it here would override the Dockerfile version — so we omit it.
