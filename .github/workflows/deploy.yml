name: Deploy Frontend to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy Frontend (PM2 + Rsync)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
        run: pnpm build

      - name: Deploy to Server & Restart PM2
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          echo "📂 Preparing remote directory..."
          ssh deploy@$HOST "mkdir -p /opt/collabify-frontend"
          
          echo "🚀 Syncing build output via Rsync..."
          rsync -avz --delete .output/ deploy@$HOST:/opt/collabify-frontend/.output/
          
          echo "♻️ Restarting PM2 process..."
          ssh deploy@$HOST '
            export PATH=$PATH:/usr/local/bin:/usr/bin
            pm2 restart collabify-frontend || pm2 start /opt/collabify-frontend/.output/server/index.mjs --name collabify-frontend
            pm2 save
          '
