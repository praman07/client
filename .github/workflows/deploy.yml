name: Deploy Frontend to Production

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/official-collabify/client

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Build & Push Frontend Image
        run: |
          docker build \
            -f Dockerfile \
            --build-arg VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cp /opt/collabify/.image-tags /opt/collabify/.image-tags.prev 2>/dev/null || true
            PREV_BACKEND=$(grep BACKEND_TAG /opt/collabify/.image-tags 2>/dev/null | cut -d= -f2 || echo latest)
            echo "BACKEND_TAG=$PREV_BACKEND" > /opt/collabify/.image-tags
            echo "FRONTEND_TAG=${{ github.sha }}" >> /opt/collabify/.image-tags

            cd /opt/collabify
            FRONTEND_TAG=${{ github.sha }} docker compose pull frontend
            FRONTEND_TAG=${{ github.sha }} docker compose up -d --no-deps --force-recreate frontend

            sleep 30
            curl -sf http://localhost:3000/ || \
              (source /opt/collabify/.image-tags.prev && \
               docker compose up -d --no-deps frontend && \
               echo "\u274c Frontend rollback done" && exit 1)

            docker image prune -f
            echo "\u2705 Frontend deploy: ${{ github.sha }}"
