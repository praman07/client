  actor: User
  chatMessage: ChatMessage
  workspace: Workspace
  project: Project
  task: Task
  page: Page
}

type Task {
  id: ID!
  title: String!
  statusName: String!
}

type Page {
  id: ID!
  title: String!
}

type ProjectMember {
  id: ID!
  user: User!
  userId: ID!
  role: String
  joinedAt: String!
}

type Project {
  id: ID!
  workspaceId: String!
