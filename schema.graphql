"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  health: String!
  me: User
  getWorkspaceInviteInfo(token: String!): WorkspaceInviteInfo!
  myWorkspaces: [Workspace!]!
  onboardingStatus: OnboardingStatus!
  workspaceBySlug(slug: String!): Workspace!
  workspaceMembers(workspaceId: ID!): [WorkspaceMember!]!

  """Get paginated notifications for the current user."""
  notifications(limit: Int, cursor: String, isRead: Boolean): NotificationConnection!

  """Get count of unread notifications."""
  unreadNotificationCount: Int!
  myProjects(workspaceId: ID!): [Project!]!
  projectBySlug(workspaceId: ID!, slug: String!): Project
  project(id: ID!): Project
  getThreadMessages(parentMessageId: ID!, limit: Int, beforeCursor: ID): [ChatMessage!]!
  getMessageById(messageId: ID!): ChatMessage
  getMessagesAfterCursor(channelId: ID!, afterCursor: ID!, limit: Int): [ChatMessage!]!
  getMissingMessages(channelId: ID!, rangeStart: ID!, rangeEnd: ID!): [ChatMessage!]!
  getChannelMembers(channelId: ID!, limit: Int, offset: Int): [ChatMember!]!
  getLastReadMessage(channelId: ID!): ID
  messagesDelta(conversationId: ID!, afterSequence: Int, afterStreamId: String, limit: Int): MessagesDelta!
  history(conversationId: ID!, beforeSequence: Int!, limit: Int): HistoryPayload!
  messageReactions(messageId: ID!): [MessageReaction!]!
  reactionUsers(messageId: ID!, emoji: String!, cursor: Int): ReactionUsersConnection!
  getUnreadCounts(workspaceId: ID!, projectId: ID!): UnreadCountsResponse!
  getReadReceipts(messageId: ID!): ReadReceiptsResponse!
  getUserConversations(workspaceId: ID!, projectId: ID!, type: ConversationType, includeArchived: Boolean, limit: Int, cursor: String): ConversationConnection!
  getConversation(conversationId: ID!): ConversationDetails!
  getDmByUsers(workspaceId: ID!, projectId: ID!, otherUserId: ID!): DmConversation
}

type Mutation {
  _health: String
  syncUser(clerkId: String!, email: String!, fullName: String, avatarUrl: String, emailVerified: Boolean): User!
  acceptWorkspaceInvite(input: AcceptInviteInput!): JoinResponse!
  checkSlugAvailability(slug: String!): AvailabilityResponse!
  createOnboardingWorkspace: Workspace!
  createWorkspace(slug: String!, name: String!): Workspace!
  inviteToWorkspace(input: InviteToWorkspaceInput!): InviteResponse!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): InviteResponse!
  updateWorkspaceMemberRole(workspaceId: ID!, memberId: ID!, role: String!): WorkspaceMember!

  """Mark specific notifications as read."""
  markNotificationRead(ids: [ID!]!): Boolean!

  """Mark all notifications as read."""
  markAllNotificationsRead: Boolean!
  createProject(workspaceId: ID!, input: CreateProjectInput!): Project!
  checkProjectSlugAvailability(workspaceId: ID!, slug: String!): AvailabilityResponse!
  createChannel(input: CreateChannelInput!): Conversation!
  archiveChannel(input: ArchiveChannelInput!): Conversation!
  renameChannel(input: RenameChannelInput!): Conversation!
  createThread(input: CreateThreadInput!): Conversation!
  checkChannelAvailability(input: CheckChannelAvailabilityInput!): ChannelAvailabilityResponse!
  createDm(input: CreateDmInput!): Conversation!
  createGroup(input: CreateGroupInput!): Conversation!
  deleteChannel(workspaceId: ID!, channelId: ID!): DeleteChannelResult!
  unarchiveChannel(workspaceId: ID!, channelId: ID!): UnarchiveChannelResult!
  updateChannelDescription(workspaceId: ID!, channelId: ID!, description: String): UpdateChannelDescriptionResult!
  updateChannelVisibility(workspaceId: ID!, channelId: ID!, isPublic: Boolean!): UpdateChannelVisibilityResult!
  addChannelMembers(workspaceId: ID!, channelId: ID!, userIds: [ID!]!): AddChannelMembersResult!
  removeChannelMember(workspaceId: ID!, channelId: ID!, userId: ID!): RemoveChannelMemberResult!
  deleteDm(workspaceId: ID!, dmId: ID!): DeleteDmResult!
  muteConversation(conversationId: ID!, isMuted: Boolean!): MuteConversationResult!
  renameGroup(workspaceId: ID!, groupId: ID!, name: String!): RenameGroupResult!
  deleteGroup(workspaceId: ID!, groupId: ID!): DeleteGroupResult!
  addGroupMembers(workspaceId: ID!, groupId: ID!, userIds: [ID!]!): AddGroupMembersResult!
  removeGroupMember(workspaceId: ID!, groupId: ID!, userId: ID!): RemoveGroupMemberResult!
  leaveGroup(workspaceId: ID!, groupId: ID!): LeaveGroupResult!
  closeThread(workspaceId: ID!, threadId: ID!): CloseThreadResult!
  reopenThread(workspaceId: ID!, threadId: ID!): ReopenThreadResult!
  deleteThread(workspaceId: ID!, threadId: ID!): DeleteThreadResult!
  subscribeThread(threadId: ID!): SubscribeThreadResult!
  unsubscribeThread(threadId: ID!): UnsubscribeThreadResult!
}

type User {
  id: ID!
  email: String!
  fullName: String
  avatarUrl: String
  status: String!
  createdAt: String!
  updatedAt: String!
}

type Workspace {
  id: ID!
  slug: String!
  name: String!
  logoUrl: String
  domainWhitelist: String
  createdAt: String!
  updatedAt: String!
}

input AcceptInviteInput {
  token: String!
  userId: String
  userEmail: String
}

type JoinResponse {
  success: Boolean!
  message: String!
  workspaceSlug: String!
}

type AvailabilityResponse {
  available: Boolean!
  message: String
  reservationId: String
  reason: String
}

input InviteToWorkspaceInput {
  workspaceId: ID!
  emails: [String!]!
}

type InviteResponse {
  success: Boolean!
  message: String!
