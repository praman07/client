}

type ChatMessage {
  id: ID!
  conversationId: ID!
  authorUserId: ID!
  content: JSON!
  type: String!
  streamId: String!
  sequence: Int!
  createdAt: DateTime!
  parentMessageId: ID
  replyCount: Int!
  isEdited: Boolean!
