type Query {
  health: String!
  me: User
  getWorkspaceInviteInfo(token: String!): WorkspaceInviteInfo!
  myWorkspaces: [Workspace!]!
  onboardingStatus: OnboardingStatus!
  workspaceBySlug(slug: String!): Workspace!
  workspaceMembers(workspaceId: ID!): [WorkspaceMember!]!

  """
  Get paginated notifications for the current user.
  """
  notifications(
    limit: Int
    cursor: String
    isRead: Boolean
  ): NotificationConnection!

  """
  Get count of unread notifications.
  """
  unreadNotificationCount: Int!
  myProjects(workspaceId: ID!): [Project!]!
  projectBySlug(workspaceId: ID!, slug: String!): Project
  project(id: ID!): Project
  getThreadMessages(
    parentMessageId: ID!
    limit: Int
    beforeCursor: ID
  ): [ChatMessage!]!
  getMessageById(messageId: ID!): ChatMessage
  getMessagesAfterCursor(
    channelId: ID!
    afterCursor: ID!
    limit: Int
  ): [ChatMessage!]!
  getMissingMessages(
    channelId: ID!
    rangeStart: ID!
    rangeEnd: ID!
  ): [ChatMessage!]!
  getChannelMembers(
    channelId: ID!
    limit: Int
    offset: Int
  ): [ChatMemberRecord!]!
  getLastReadMessage(channelId: ID!): ID
  messagesDelta(
    conversationId: ID!
    afterSequence: Int
    afterStreamId: String
    limit: Int
  ): MessagesDelta!
  history(
    conversationId: ID!
    beforeSequence: Int!
    limit: Int
  ): HistoryPayload!
  messageReactions(messageId: ID!): [MessageReaction!]!
  reactionUsers(
    messageId: ID!
    emoji: String!
    cursor: Int
  ): ReactionUsersConnection!
  getUnreadCounts(workspaceId: ID!, projectId: ID!): UnreadCountsResponse!
  getReadReceipts(messageId: ID!): ReadReceiptsResponse!
  getUserConversations(
    workspaceId: ID!
    projectId: ID!
    type: ConversationType
    includeArchived: Boolean
    limit: Int
    cursor: String
  ): ConversationConnection!
  getConversation(conversationId: ID!): Conversation!
  getDmByUsers(
    workspaceId: ID!
    projectId: ID!
    otherUserId: ID!
  ): DmConversation
  getUsersByIds(userIds: [ID!]!): [UserBasic!]!
  getBoard(boardId: ID!): Whiteboard
  userBoards(workspaceId: ID!, limit: Int, cursor: ID): BoardConnection!
  boardCollaborators(boardId: ID!): [BoardCollaborator!]!
  workspaceBoards(
    workspaceId: ID!
    includeArchived: Boolean
    limit: Int
    cursor: ID
  ): BoardConnection!
  getBoardSnapshot(boardId: ID!, clientSnapshot: String): BoardSnapshot!
  activeCollaborators(boardId: ID!): [ActiveCollaborator!]!

  """
  Fetch page metadata. Use getPageSnapshot for Y.Doc content.
  """
  getPage(pageId: ID!): Page!

  """
  Returns the authoritative Y.Doc snapshot diff + a stream cursor for gap-fill.

  First open (no offline state):
    getPageSnapshot(pageId: "cuid")

  Reconnect with offline edits:
    getPageSnapshot(pageId: "cuid", clientSnapshot: "<base64 Y.encodeStateAsUpdate>")

  Client workflow:
    1. Call this query → receive { snapshot, lastStreamId }
    2. Apply snapshot: Y.applyUpdate(localDoc, base64Decode(snapshot))
    3. Open WS: page:subscribe-page { pageId, lastStreamId }  ← gap-fill
  """
  getPageSnapshot(pageId: ID!): PageSnapshot!

  """
  Returns the full nested page tree for a project (non-archived, non-deleted).
  """
  getProjectPages(projectId: ID!): [Page!]!

  """
  DB collaborator list (authoritative). For real-time presence, use getActivePageCollaborators.
  """
  getPageCollaborators(pageId: ID!): [PageCollaborator!]!

  """
  Live presence from Redis ZSET (not DB). Reflects current editing sessions.
  """
  getActivePageCollaborators(pageId: ID!): [PageCollaborator!]!

  """
  Returns the immediate children (subfolders + files) of a folder.
  parentFolderId = null → Home view (root-level items with no parent).
  """
  getVaultChildren(
    projectId: ID!
    parentFolderId: ID
    cursor: ID
    limit: Int
    sortBy: VaultSortField
    sortDir: SortDirection
  ): VaultChildrenResult!

  """
  Returns full metadata for a single vault folder or file.
  Used for the detail/info side panel. Not used for listing.
  """
  getVaultNode(id: ID!, type: VaultNodeType!): VaultNode!

  """
  Returns sidebar data: user-pinned folders + system folders (From Chat, From Pages, etc.).
  Fetched once on Vault mount. Never re-called during folder navigation.
  """
  getVaultSidebar(projectId: ID!): VaultSidebar!

  """
  Returns a short-lived presigned GET URL for downloading or previewing a vault file.
  URL is valid for 5 minutes. Never cache — always request fresh.
  """
  getVaultDownloadUrl(fileId: ID!): VaultDownloadUrl!

  """
  Returns current storage usage for the project and its workspace.
  Poll every 60 seconds + invalidate after uploads/deletions.
  """
  getVaultUsage(projectId: ID!): VaultUsage!

  """
  Returns the ancestor folder chain for a given folder, ordered root → current.
  The last element is the folder itself, the first is the top-level ancestor.
  Returns [] when the folder has no parent (it is already at root level).
  Used exclusively by the vault breadcrumb (server fallback path for direct URL visits).
  """
  getVaultAncestors(folderId: ID!): [VaultFolder!]!
}

type Mutation {
  _health: String
  syncUser(
    clerkId: String!
    email: String!
    fullName: String
    avatarUrl: String
    emailVerified: Boolean
  ): User!
  acceptWorkspaceInvite(input: AcceptInviteInput!): JoinResponse!
  checkSlugAvailability(slug: String!): AvailabilityResponse!
  createOnboardingWorkspace: Workspace!
  createWorkspace(slug: String!, name: String!): Workspace!
  inviteToWorkspace(input: InviteToWorkspaceInput!): InviteResponse!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): InviteResponse!
  updateWorkspaceMemberRole(
    workspaceId: ID!
    memberId: ID!
    role: String!
  ): WorkspaceMember!

  """
  Mark specific notifications as read.
  """
  markNotificationRead(ids: [ID!]!): Boolean!

  """
  Mark all notifications as read.
  """
  markAllNotificationsRead: Boolean!
  createProject(workspaceId: ID!, input: CreateProjectInput!): Project!
  checkProjectSlugAvailability(
    workspaceId: ID!
    slug: String!
  ): AvailabilityResponse!
  createChannel(input: CreateChannelInput!): Conversation!
  archiveChannel(input: ArchiveChannelInput!): Conversation!
  renameChannel(input: RenameChannelInput!): Conversation!
  createThread(input: CreateThreadInput!): Conversation!
  checkChannelAvailability(
    input: CheckChannelAvailabilityInput!
  ): ChannelAvailabilityResponse!
  createDm(input: CreateDmInput!): Conversation!
  createGroup(input: CreateGroupInput!): Conversation!
  deleteChannel(workspaceId: ID!, channelId: ID!): DeleteChannelResult!
  unarchiveChannel(workspaceId: ID!, channelId: ID!): UnarchiveChannelResult!
  updateChannelDescription(
    workspaceId: ID!
    channelId: ID!
    description: String
  ): UpdateChannelDescriptionResult!
  updateChannelVisibility(
    workspaceId: ID!
    channelId: ID!
    isPublic: Boolean!
  ): UpdateChannelVisibilityResult!
  addChannelMembers(
    workspaceId: ID!
    channelId: ID!
    userIds: [ID!]!
  ): AddChannelMembersResult!
  removeChannelMember(
    workspaceId: ID!
    channelId: ID!
    userId: ID!
  ): RemoveChannelMemberResult!
  deleteDm(workspaceId: ID!, dmId: ID!): DeleteDmResult!
  muteConversation(
    conversationId: ID!
    isMuted: Boolean!
  ): MuteConversationResult!
  renameGroup(workspaceId: ID!, groupId: ID!, name: String!): RenameGroupResult!
  deleteGroup(workspaceId: ID!, groupId: ID!): DeleteGroupResult!
  addGroupMembers(
    workspaceId: ID!
    groupId: ID!
    userIds: [ID!]!
  ): AddGroupMembersResult!
  removeGroupMember(
    workspaceId: ID!
    groupId: ID!
    userId: ID!
  ): RemoveGroupMemberResult!
  leaveGroup(workspaceId: ID!, groupId: ID!): LeaveGroupResult!
  closeThread(workspaceId: ID!, threadId: ID!): CloseThreadResult!
  reopenThread(workspaceId: ID!, threadId: ID!): ReopenThreadResult!
  deleteThread(workspaceId: ID!, threadId: ID!): DeleteThreadResult!
  subscribeThread(threadId: ID!): SubscribeThreadResult!
  unsubscribeThread(threadId: ID!): UnsubscribeThreadResult!
  createBoard(input: CreateBoardInput!): BoardPayload!
  deleteBoard(boardId: ID!): DeleteBoardResult!
  renameBoard(boardId: ID!, title: String!): Whiteboard!
  updateBoardDescription(boardId: ID!, description: String): Whiteboard!
  addBoardCollaborators(
    boardId: ID!
    userIds: [ID!]!
  ): AddBoardCollaboratorsResult!
  removeBoardCollaborator(
    boardId: ID!
    userId: ID!
  ): RemoveBoardCollaboratorResult!
  archiveBoard(boardId: ID!): Whiteboard!
  unarchiveBoard(boardId: ID!): Whiteboard!
  lockBoard(boardId: ID!): Whiteboard!
  unlockBoard(boardId: ID!): Whiteboard!

  """
  Creates a new page in a project. Initialises Y.Doc and uploads initial snapshot to S3.
  The calling user is automatically added as an EDITOR collaborator.
  """
  createPage(input: CreatePageInput!): CreatePageResult!

  """
  Soft-deletes a page. Fails with 409 if the page has active subscribers.
  Does not cascade to child pages — handle descendants explicitly first.
  """
  deletePage(input: DeletePageInput!): DeletePageResult!
  renamePage(input: RenamePageInput!): RenamePageResult!

  """
  Archives a page and all its descendants.
  """
  archivePage(input: ArchivePageInput!): ArchivePageResult!

  """
  Unarchives a page. Fails if the parent is still archived.
  Child pages are NOT automatically unarchived — handle each explicitly.
  """
  unarchivePage(input: UnarchivePageInput!): UnarchivePageResult!

  """
  Acquires an exclusive editor lock on the page.
  Returns 423 if another user currently holds the lock.
  Lock auto-releases after 1 hour (safety net for crashed clients).
  """
  lockPage(input: LockPageInput!): LockPageResult!

  """
  Lock owner or workspace ADMIN can unlock.
  """
  unlockPage(input: UnlockPageInput!): UnlockPageResult!

  """
  Moves a page to a new position (and optionally a new parent).
  Validate no circular nesting before calling (circular guard runs server-side too).
  """
  reorderPage(input: ReorderPageInput!): ReorderPageResult!

  """
  Upsert-semantics: can be used for both inviting and changing roles.
  """
  addPageCollaborators(
    input: AddPageCollaboratorsInput!
  ): AddPageCollaboratorsResult!

  """
  Cannot remove the page creator.
  """
  removePageCollaborator(
    input: RemovePageCollaboratorInput!
  ): RemovePageCollaboratorResult!

  """
  Step 1 of 2 for uploading a file to Vault.
  Checks quota, creates a PENDING VaultFile row, returns a presigned PUT URL.
  The client must PUT the file directly to S3 using this URL, then call confirmVaultUpload.
  """
  requestVaultUpload(input: RequestVaultUploadInput!): RequestUploadResult!

  """
  Step 2 of 2 for uploading a file to Vault.
  Verifies the S3 object (size + MIME), sets the file to ACTIVE, and updates storage usage.
  """
  confirmVaultUpload(input: ConfirmVaultUploadInput!): ConfirmUploadResult!
  createVaultFolder(input: CreateVaultFolderInput!): CreateFolderResult!
  renameVaultFolder(input: RenameVaultFolderInput!): RenameFolderResult!

  """
  Soft-deletes a folder.
  cascade=false (default): returns error if folder is non-empty.
  cascade=true: recursively soft-deletes all child folders and files.
  """
  deleteVaultFolder(input: DeleteVaultFolderInput!): DeleteResult!
  moveVaultFolder(input: MoveVaultFolderInput!): MoveFolderResult!
  moveVaultFile(input: MoveVaultFileInput!): MoveFileResult!

  """
  Renames a file. S3 key is unchanged — only the display name is updated.
  """
  renameVaultFile(input: RenameVaultFileInput!): RenameFileResult!

  """
  Soft-deletes a vault file and releases its storage quota.
  """
  deleteVaultFile(input: DeleteVaultFileInput!): DeleteResult!
  pinVaultFolder(input: PinVaultFolderInput!): PinFolderResult!
  unpinVaultFolder(input: UnpinVaultFolderInput!): DeleteResult!
}

