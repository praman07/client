type Query {
  health: String!
  me: User
  myWorkspaces: [Workspace!]!
  onboardingStatus: OnboardingStatus!
  workspaceBySlug(slug: String!): Workspace!
  getWorkspaceInviteInfo(token: String!): WorkspaceInviteInfo!
  workspaceMembers(workspaceId: ID!): [WorkspaceMember!]!

  """
  Get paginated notifications for the current user.
  """
  notifications(
    limit: Int
    cursor: String
    isRead: Boolean
  ): NotificationConnection!

  """
  Get count of unread notifications.
  """
  unreadNotificationCount: Int!
  myProjects(workspaceId: ID!): [Project!]!
  project(id: ID!): Project
  projectBySlug(workspaceId: ID!, slug: String!): Project
}

type Mutation {
  _health: String
  syncUser(
    clerkId: String!
    email: String!
    fullName: String
    avatarUrl: String
    emailVerified: Boolean
  ): User!
  createOnboardingWorkspace: Workspace!
  checkSlugAvailability(slug: String!): AvailabilityResponse!
  createWorkspace(slug: String!, name: String!): Workspace!
  inviteToWorkspace(input: InviteToWorkspaceInput!): InviteResponse!
  acceptWorkspaceInvite(input: AcceptInviteInput!): JoinResponse!
  updateWorkspaceMemberRole(
    workspaceId: ID!
    memberId: ID!
    role: String!
  ): WorkspaceMember!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): InviteResponse!

  """
  Mark specific notifications as read.
  """
  markNotificationRead(ids: [ID!]!): Boolean!

  """
  Mark all notifications as read.
  """
  markAllNotificationsRead: Boolean!
  checkProjectSlugAvailability(
    workspaceId: ID!
    slug: String!
  ): AvailabilityResponse!
  createProject(workspaceId: ID!, input: CreateProjectInput!): Project!
}

type User {
  id: ID!
  email: String!
  fullName: String
  avatarUrl: String
  status: String!
  createdAt: String!
  updatedAt: String!
}

type Workspace {
  id: ID!
  slug: String!
  name: String!
  logoUrl: String
  domainWhitelist: String
  createdAt: String!
  updatedAt: String!
}

type OnboardingStatus {
  hasUser: Boolean!
  hasWorkspace: Boolean!
  hasProject: Boolean!
  workspaceSlug: String
}

type AvailabilityResponse {
  available: Boolean!
  message: String
  reservationId: String
  reason: String
}

type InviteResponse {
  success: Boolean!
  message: String!
  invitedCount: Int!
}

type WorkspaceInviteInfo {
  workspaceName: String!
  workspaceLogoUrl: String
  inviterName: String
}

type JoinResponse {
  success: Boolean!
  message: String!
  workspaceSlug: String!
}

type WorkspaceMember {
  id: ID!
  role: String!
  joinedAt: String!
  user: User!
}

input InviteToWorkspaceInput {
  workspaceId: ID!
  emails: [String!]!
}

input AcceptInviteInput {
  token: String!
  userId: String
  userEmail: String
}

scalar DateTime

scalar JSON

type Notification {
  id: ID!
  recipientUserId: String!
  actorId: String
  entityType: String!
  entityId: String!
  category: String!
  isRead: Boolean!
  isArchived: Boolean!
  createdAt: DateTime!
  data: JSON
  actor: User
  workspace: Workspace
  project: Project
  page: Page
  task: Task
  chatMessage: ChatMessage
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Project {
  id: ID!
  name: String!
  key: String!
  workspaceId: String!
  description: String
  isPrivate: Boolean
  isArchived: Boolean
  createdAt: String!
  updatedAt: String!
  members: [ProjectMember!]!
}

type Task {
  id: ID!
  title: String!
  statusName: String!
}

type Page {
  id: ID!
  title: String!
}

type ChatMessage {
  id: ID!
  content: String!
}

type ProjectMember {
  id: ID!
  user: User!
  userId: ID!
  role: String
  joinedAt: String!
}

input CreateProjectInput {
  name: String!
  slug: String
  description: String
}
